# test: the automated tests (./mvnw verify, locally and in CI), activated by @IntegrationTest.
# Lives on the test classpath, so none of this ships in the application jar.
# The database comes from Testcontainers (@ServiceConnection in TestcontainersConfiguration), which
# replaces spring.datasource.*. No test calls another service: FakeAnalysisApi and FakeInterviewApi (task 4.1).

spring:
  http:
    serviceclient:
      analysis:
        base-url: http://analysis.invalid    # never called: the tests use FakeAnalysisApi (TestDoublesConfiguration)
      interview:
        base-url: http://interview.invalid   # never called: the tests use FakeInterviewApi
  graphql:
    graphiql:
      enabled: false

app:
  rate-limits:   # task 4.4: so high that no test meets them by chance; RateLimitTest sets its own
    submit-project:
      capacity: 10000
      refill-every: 1ms
    start-interview:
      capacity: 10000
      refill-every: 1ms
