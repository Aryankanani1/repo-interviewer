# prod: live. Connection settings come from environment variables (Kubernetes ConfigMap and Secret in
# Phase 3): SPRING_PROFILES_ACTIVE=prod, ANALYSIS_BASE_URL, INTERVIEW_BASE_URL (no database since task 4.1), and
# JWT_PUBLIC_KEY_LOCATION (task 4.4): without it the gateway does not start, so it never runs without authentication.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  graphql:
    graphiql:
      enabled: false
    schema:
      inspection:
        enabled: false   # the startup report about unmapped fields is a development aid
      introspection:
        enabled: false   # no __schema or __type (task 4.6): GraphiQL is off here, and no client needs them

app:
  graphql:
    trusted-documents-only: true   # task 4.6: only the operations in graphql-documents/ run, any other query is refused
