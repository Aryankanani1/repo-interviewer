# dev: your machine (DECISIONS.md D-015). Run next to the other two: ./mvnw -pl interview-service -am spring-boot:run
# Needs Compose Postgres with db/bootstrap.sql applied once (README) and analysis-service on localhost:8082.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/repo_interviewer
    # Not DB_USER: .env sets that to the Compose admin user.
    username: ${INTERVIEW_DB_USER:interview_svc}
    password: ${INTERVIEW_DB_PASSWORD:interview_svc}
  http:
    serviceclient:
      analysis:
        base-url: ${ANALYSIS_BASE_URL:http://localhost:${ANALYSIS_PORT:8082}}   # analysis-service's dev port
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9094}

server:
  # The app is on 8080 and calls this one; 8082 is analysis-service, 8083 a second app instance (task 2.6).
  # INTERVIEW_PORT changes it for both this service and the app.
  port: ${INTERVIEW_PORT:8084}

logging:
  level:
    com.aryankanani.repointerviewer: DEBUG

app:
  llm:
    # Your own prepaid credits pay for dev calls. 48 calls is about $5.30 a day at worst (each a Sonnet 5 call with
    # ~20K tokens in and the largest output cap out, 7000 for a question: about $0.11 at $2 / $10 per MTok),
    # so a bug or a loop cannot burn through a small top-up in one afternoon. Raise it on purpose when needed.
    max-calls-per-day: 48   # 48 here + 12 in analysis-service (D-026)
