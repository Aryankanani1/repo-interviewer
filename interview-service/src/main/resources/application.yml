# interview-service configuration (task 4.1, DECISIONS.md D-026): the default (base) settings that every environment
# starts from, like the app's application.yml (environments: DECISIONS.md D-015). No localhost fallbacks here either.
#
# Its own database user and schema: DB_USER is interview_svc in every environment, created once by the database
# admin with db/bootstrap.sql. Flyway keeps its history table in the schema "interview", and Hibernate validates and
# writes the entities there. Projects and code come from analysis-service (AnalysisApi over HTTP).

spring:
  application:
    name: interview-service
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: interview
  flyway:
    enabled: true
    schemas: interview
  # Kafka only with the "kafka" profile, as in the app (LLD §13): the answer flow runs on its own topics.
  kafka:
    admin:
      fail-fast: true
    producer:
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 900000
    template:
      observation-enabled: true   # a span per send, and the trace in the record's headers (task 4.3)
    listener:
      ack-mode: record
      observation-enabled: true   # a span per record, continuing the trace from its headers (task 4.3)
  # analysis-service's AnalysisApi (AnalysisClientConfiguration). No fallback URL: dev sets localhost:8082, stage and
  # prod set ANALYSIS_BASE_URL. The slowest call is a chunk search, which embeds its query (a second or two while
  # Ollama loads the model): 10 s to read (30 s until task 4.2), so a hung analysis-service fails a call in 10 s.
  # The JDK's HttpClient, named because ServiceCallGuard's retry knows its exceptions (task 4.2).
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      analysis:
        base-url: ${ANALYSIS_BASE_URL}
        connect-timeout: 2s
        read-timeout: 10s
  ai:
    model:
      chat: anthropic        # plan, questions, grades, report; no embeddings here
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      max-retries: 2
      chat:
        model: claude-sonnet-5   # default; the gateway sets model and max tokens per purpose (app.llm.*)
        max-tokens: 2048

server:
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: 1.0   # every request (Boot's default is 10%): few requests, each one worth a trace (task 4.3)
  otlp:
    metrics:
      export:
        enabled: false   # the OpenTelemetry starter would also push metrics over OTLP; they stay on /actuator
  metrics:
    distribution:
      percentiles-histogram:
        ri.llm.call: true   # buckets, so Prometheus can compute p50 and p95 per purpose (task 4.3)
      maximum-expected-value:
        ri.llm.call: 120s   # app.llm.timeout is 60 s per request, plus the Anthropic client's retries; default 30 s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# OpenAPI docs of the internal API (task 4.2), generated from the controller: the spec at /v3/api-docs (the Service
# is reachable only inside the cluster), Swagger UI only in dev. Only /internal/**: not the error page.
springdoc:
  paths-to-match: /internal/**
  swagger-ui:
    enabled: false
  open-api:
    info:
      title: interview-service internal API
      description: >-
        Interviews, for graphql-gateway. The source of truth is the Java interface contracts.interview.InterviewApi,
        which both the controller and the gateway's HTTP client use. Expected failures before anything is saved are
        RFC 9457 problem details with the ErrorCode in "code" and the input field in "field": 404 NOT_FOUND,
        429 BUDGET_EXCEEDED, 503 LLM_UNAVAILABLE, 422 the others. A failure after something was saved comes back
        inside the response, as "error" next to what was saved.

logging:
  pattern:
    level: "%5p %X{projectId:-}%X{sessionId:-}"
  level:
    com.aryankanani.repointerviewer: INFO

# Exactly the app.* sections AppPropertiesConfiguration binds (task 4.1 step 4a). A misspelled key inside one of them
# stops the start; a section nobody binds would not be read, so another service's sections are left out.
app:
  retrieval:
    max-context-tokens: 6000   # tokens of code a prompt may carry: the budget of each chunk search
  outbox:
    poll-interval: 500ms
    batch-size: 100
  roles:
    api: true                # this service's REST API (InterviewApi)
    interview-worker: true   # the answer evaluation consumer and the orchestrator
  consumer-retry:
    max-retries: 3
    initial-backoff: 1s
  service-calls:                # calls to another service over HTTP (task 4.2, ServiceCallGuard)
    max-attempts: 3             # tried again only when the connection failed: the request was never sent
    retry-backoff: 200ms        # then 400 ms
    sliding-window-size: 10     # the circuit breaker looks at the latest 10 calls;
    minimum-calls: 5            # once at least 5 were made
    failure-rate-threshold: 50  # and half of them got no answer (refused, timed out), it opens:
    open-duration: 10s          # every call fails at once for 10 s, without a request,
    trial-calls: 2              # then 2 go through, and if they get answers it closes
  interview:
    default-question-count: 5
    min-question-count: 3
    max-question-count: 8
    max-follow-ups-per-topic: 1
    follow-up-score-min: 3
    follow-up-score-max: 7
    answer-max-chars: 4000
    prefetch-enabled: true    # write the next topic's question while the candidate answers (task 1.16)
  llm:
    models:
      summary: claude-haiku-4-5
      plan: claude-sonnet-5
      question: claude-sonnet-5
      follow-up: claude-sonnet-5
      evaluation: claude-sonnet-5
      report: claude-haiku-4-5
    # At least 2x the largest output measured in task 1.15 (docs/RESULTS.md), rounded up to 1000. A reply cut off
    # at its cap is unreadable JSON, and the second attempt hits the same cap. Only the tokens written are billed.
    max-output-tokens:
      summary: 3000      # 1430 measured
      plan: 3000         # 1425
      question: 7000     # 3276 in the 1.17 eval (1500 cut it off in 1.15)
      follow-up: 2000    # 751
      evaluation: 3000   # 1571 (1200 cut it off twice)
      report: 3000       # 1075
    max-calls-per-session: 30
    # The daily cap is per service (D-026), counted in this service's own llm_call table: 4/5 of the old total here,
    # 1/5 in analysis-service (dev 48 + 12, stage 80 + 20, prod 240 + 60). The GraphQL app makes no model calls.
    max-calls-per-day: 240
    timeout: 60s
    prompt-caching: true   # task 4.5: PLAN's project context in Anthropic's 5-minute prompt cache (LLD §8.1)
