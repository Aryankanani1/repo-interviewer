# graphql-gateway (task 4.1 step 4c, LLD §14.3): the public GraphQL API and the SSE subscriptions, behind the Service
# "graphql-gateway". No database and no API key: it calls analysis-service and interview-service (ANALYSIS_BASE_URL,
# INTERVIEW_BASE_URL in the ConfigMap "app") and reads their events from Kafka. Every request needs a JWT, checked with
# the public key in the Secret "jwt-public-key" (task 4.4; the overlay makes it). Shutdown: 5 s to leave the Service,
# then Spring's graceful shutdown (open requests get up to 30 s), within the 45 s grace period.
# It was the Deployment "api" of the single app until task 4.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
        app.kubernetes.io/component: app
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:   # the image's non-root user (task 3.1); Kubernetes refuses to start it as root
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: graphql-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: stage,kafka
            - name: JWT_PUBLIC_KEY_LOCATION
              value: file:/etc/jwt/jwt-public.pem
          # Startup: up to 5 min to boot before the other two probes begin (three JVMs booting at once on a busy
          # laptop node took over 3 min; alone, 12 s). Liveness: is this JVM still working? Restart it only after
          # a minute without an answer: a busy but healthy JVM (a long GC pause, a starved node) must not be killed.
          # Readiness: may it get traffic now? (No database here; the services behind it are not checked.)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:   # on shutdown, wait 5 s first: the Service stops sending it requests before Spring stops
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:   # what the scheduler reserves on the node
              cpu: 250m
              memory: 512Mi
            limits:     # memory only: the container is killed above it; no CPU limit, so it is never throttled
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # it can write only /tmp below
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-public-key
              mountPath: /etc/jwt
              readOnly: true
      volumes:
        - name: tmp   # Tomcat's temporary files
          emptyDir:
            sizeLimit: 256Mi
        - name: jwt-public-key   # only the public key: the gateway checks tokens, it cannot make them
          secret:
            secretName: jwt-public-key
---
# The gateway inside the cluster, on port 8080. Locally: kubectl port-forward svc/graphql-gateway 8080:8080.
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
