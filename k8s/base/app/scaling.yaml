# Autoscaling the workers on Kafka consumer lag (task 3.4, LLD §14.4): KEDA reads how many events each consumer
# group has not handled yet and drives an HPA, so the replicas are about lag / lagThreshold. A group cannot use more
# consumers than its topic has partitions (3), so above 3 KEDA adds no more (allowIdleConsumers is false).
# Kafka by its full DNS name: KEDA connects to it from its own namespace "keda", where the short name does not resolve.
# The HPA reads the lag through KEDA's metrics server about every 15 s (its own sync period); KEDA's pollingInterval
# only matters when scaling from or to zero (minReplicaCount 0), which these do not.
# The Deployments have no `replicas`: the HPA owns that field, and an apply must not set it back.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: interview-worker
spec:
  scaleTargetRef:
    name: interview-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: kafka   # the evaluation worker: answers waiting to be graded
      metadata:
        bootstrapServers: events-kafka-bootstrap.repo-interviewer.svc:9092
        consumerGroup: interview-evaluate
        topic: interview.answer.submitted
        lagThreshold: "2"
        offsetResetPolicy: earliest   # as the consumers: a group without an offset starts at the oldest event
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analysis-worker
spec:
  scaleTargetRef:
    name: analysis-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:   # one Deployment runs ingest and embed; the HPA follows whichever trigger asks for more
    - type: kafka   # the embedding worker: projects whose chunks wait for vectors
      metadata:
        bootstrapServers: events-kafka-bootstrap.repo-interviewer.svc:9092
        consumerGroup: analysis-embed
        topic: project.chunks.ready
        lagThreshold: "2"
        offsetResetPolicy: earliest
    - type: kafka   # projects waiting to be cloned and parsed
      metadata:
        bootstrapServers: events-kafka-bootstrap.repo-interviewer.svc:9092
        consumerGroup: analysis-ingest
        topic: project.analysis.requested
        lagThreshold: "2"
        offsetResetPolicy: earliest
