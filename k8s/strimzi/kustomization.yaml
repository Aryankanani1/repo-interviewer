# Strimzi 1.3.1, the Kafka operator (task 3.2): its CRDs (Kafka, KafkaNodePool, ...), RBAC and the operator
# Deployment, from the pinned release file. Installed into the app's namespace, where it also watches for Kafka
# resources. Apply with --server-side: the CRDs are too big for a client-side apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: repo-interviewer
resources:
  - ../namespace
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.3.1/strimzi-cluster-operator-1.3.1.yaml
# The release file grants its roles to the ServiceAccount in namespace "myproject". `namespace:` above does not
# change role binding subjects, so this does: without it the operator would have no permissions here.
patches:
  - target:
      kind: (Role|ClusterRole)Binding
      name: strimzi-cluster-operator.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: repo-interviewer
