# Local kind cluster (task 3.2): the base and the database credentials (the same dev defaults as
# docker-compose.yml). Apply after k8s/strimzi.
#
# Ollama is not in this cluster (DECISIONS.md D-023): it runs natively on the Mac (GPU, D-013), and pods reach it
# at http://host.docker.internal:11434, the app's OLLAMA_BASE_URL here (task 3.3). Not through a Service alias:
# Ollama listens on 127.0.0.1 and then accepts only Host headers it trusts (localhost, *.internal), so a request
# for "ollama:11434" gets 403 (checked from a pod).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: repo-interviewer
resources:
  - ../../base
secretGenerator:
  - name: postgres   # becomes postgres-<hash>; Kustomize updates the references, so a new password restarts pods
    literals:
      - username=ri
      - password=ri
# The image built locally and loaded into the node (k8s/README.md), not from a registry.
images:
  - name: repo-interviewer
    newTag: local
# A laptop node (Docker's VM: 3.8 GiB, shared with Postgres, Kafka and Kubernetes itself) cannot hold three default
# JVMs: with them, the node ran out of memory and Postgres was killed (task 3.3). So locally the app pods are
# smaller: 384 Mi requested, 640 Mi limit, heap 50% of it; the serial collector (least overhead for a small heap);
# and only the quick JIT compiler (C1), which costs much less CPU at startup for somewhat slower peak speed.
patches:
  - target:
      kind: ConfigMap
      name: app
    patch: |-
      - op: replace
        path: /data/OLLAMA_BASE_URL
        value: http://host.docker.internal:11434
      - op: replace
        path: /data/JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=repo-interviewer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 640Mi
