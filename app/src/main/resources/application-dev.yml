# dev: your machine. Infrastructure from docker-compose.yml (Postgres on host port 5433), analysis-service on 8082 and
# interview-service on 8084 (task 4.1). The default for ./mvnw spring-boot:run (pom.xml spring-boot.run.profiles).
# The credentials below are the compose defaults for a local throwaway database, not real secrets.

spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/repo_interviewer
    username: ${DB_USER:ri}
    password: ${DB_PASSWORD:ri}
  graphql:
    graphiql:
      enabled: true   # http://localhost:8080/graphiql
  http:
    serviceclient:
      analysis:
        base-url: ${ANALYSIS_BASE_URL:http://localhost:${ANALYSIS_PORT:8082}}   # analysis-service's dev port
      interview:
        base-url: ${INTERVIEW_BASE_URL:http://localhost:${INTERVIEW_PORT:8084}}   # interview-service's dev port
  kafka:
    # docker compose --profile kafka up -d. Used only with the kafka profile (-Dspring-boot.run.profiles=dev,kafka).
    bootstrap-servers: localhost:${KAFKA_PORT:9094}

logging:
  level:
    com.aryankanani.repointerviewer: DEBUG
