# Local infrastructure.
#   docker compose up -d                    -> Postgres (pgvector)
#   docker compose --profile ollama up -d   -> also Ollama in a container + pulls the embedding model
#   docker compose --profile kafka up -d    -> also Kafka (KRaft, no ZooKeeper) on localhost:9094 + Kafka UI on
#                                              http://localhost:8090 (Phase 2; ports from KAFKA_PORT, KAFKA_UI_PORT)
# On macOS, run Ollama natively instead (see README, DECISIONS.md D-013): Docker on a Mac
# cannot use the Apple GPU, and the image is 2.8 GB. Both listen on localhost:11434.
# Kafka and Kafka UI tags checked on Docker Hub 2026-11-02 (task 2.1).

name: repo-interviewer

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: repo_interviewer
      POSTGRES_USER: ${DB_USER:-ri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ri}
    ports:
      - "${DB_PORT:-5433}:5432"   # 5433 on the host: 5432 is often taken by a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ri} -d repo_interviewer"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # One-shot helper: waits for Ollama, pulls the embedding model, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull nomic-embed-text"]
    restart: "no"

  # ---------------- Phase 2 ----------------
  kafka:
    image: apache/kafka:4.2.2   # the same version as the kafka-clients library Spring Boot 4.1.2 manages
    profiles: ["kafka"]
    # Containers (Kafka UI) use INTERNAL, kafka:29092. The app on the Mac uses EXTERNAL, localhost:9094. A client
    # first connects, then uses the address Kafka advertises, so EXTERNAL listens and advertises the host port.
    # 9094, not 9092: other local projects often run a Kafka on 9092.
    ports:
      - "${KAFKA_PORT:-9094}:${KAFKA_PORT:-9094}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:${KAFKA_PORT:-9094},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared in code (NewTopic beans)

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["kafka"]
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"   # not 8081, often held by another local app
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  pgdata:
  ollama:
